<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socle</title>
<meta name="description" content="Turn any small company into an AI-native company, without replacing a single tool.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script>
  if (matchMedia('(prefers-reduced-motion: reduce)').matches && !/[?&]motion/.test(location.search)) document.documentElement.classList.add('reduced');
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#top"><i></i>Socle</a>
  <div class="right">
    <div class="lang" role="group" data-ia="aria-label=aria.lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button></div>
    <nav class="main">
      <a href="#how" data-i="nav.how"></a>
      <a href="#status" data-i="nav.status"></a>
      <a href="#record" data-i="nav.record"></a>
      <a href="#founder" data-i="nav.founder"></a>
      <a class="cta" href="mailto:info@getsocle.com" data-i="nav.contact"></a>
    </nav>
  </div>
</header>

<section id="story">
  <div id="stage">
    <canvas id="gl" role="img" data-ia="aria-label=aria.canvas"></canvas>
    <div id="cards"></div>
    <div id="veil"></div>

    <div class="chap" data-a="0" data-b=".075" id="top">
      <p class="pill" data-i="hero.pill"></p>
      <h1 data-i="hero.h1"></h1>
      <p data-i="hero.sub"></p>
      <div class="links">
        <a class="btn primary" href="mailto:info@getsocle.com" data-i="hero.contact"></a>
        <a class="btn" href="#how" data-i="hero.how"></a>
      </div>
    </div>

    <div class="chap" data-a=".09" data-b=".26">
      <h2 data-i="c1.h"></h2>
      <p data-i="c1.p"></p>
    </div>

    <div class="chap" data-a=".285" data-b=".565">
      <h2 data-i="c2.h"></h2>
      <p data-i="c2.p"></p>
    </div>

    <div class="chap" data-a=".58" data-b=".70">
      <h2 data-i="c3.h"></h2>
      <p data-i="c3.p"></p>
    </div>

    <div class="chap" data-a=".715" data-b=".825">
      <h2 data-i="c4.h"></h2>
    </div>

    <div class="chap" data-a=".84" data-b=".93">
      <h2 data-i="c5.h"></h2>
    </div>

    <div class="chap center" data-a=".965" data-b="1.01">
      <h2 data-i="fin.h"></h2>
      <div class="links">
        <a class="btn primary" href="mailto:info@getsocle.com" data-i="fin.contact"></a>
        <a class="btn" href="#how" data-i="fin.how"></a>
      </div>
    </div>

    <div class="rail" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="scrollhint" id="hint" data-i="hint"></div>
    <div class="note" data-i="note"></div>
  </div>
</section>

<div id="still">
  <div class="step"><div><span class="kick" data-i="st1.k"></span><h1 data-i="st1.h"></h1><p data-i="st1.p"></p></div><img src="assets/temps-1.jpg" data-ia="alt=st1.alt" alt="" loading="lazy"></div>
  <div class="step"><div><span class="kick" data-i="st2.k"></span><h2 data-i="st2.h"></h2><p data-i="st2.p"></p></div><img src="assets/temps-2.jpg" data-ia="alt=st2.alt" alt="" loading="lazy"></div>
  <div class="step"><div><span class="kick" data-i="st3.k"></span><h2 data-i="st3.h"></h2><p data-i="st3.p"></p></div><img src="assets/temps-3.jpg" data-ia="alt=st3.alt" alt="" loading="lazy"></div>
  <div class="step"><div><span class="kick" data-i="st4.k"></span><h2 data-i="st4.h"></h2><p data-i="st4.p"></p></div><img src="assets/temps-4.jpg" data-ia="alt=st4.alt" alt="" loading="lazy"></div>
</div>

<main class="rest">
<div class="wrap">

<section id="how" class="blk">
  <h2 class="sec" data-i="how.h"></h2>
  <p class="biglead" data-i="how.lead"></p>
  <p data-i="how.intro"></p>
  <p data-i="how.p1"></p>
  <p data-i="how.p2"></p>
  <p data-i="how.p3"></p>
  <p data-i="how.p4"></p>
  <svg class="diagram" viewBox="0 0 640 360" role="img" aria-labelledby="dt dd" xmlns="http://www.w3.org/2000/svg">
    <title id="dt" data-i="diag.title"></title>
    <desc id="dd" data-i="diag.desc"></desc>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
    </defs>
    <rect class="box" x="10" y="10" width="620" height="92" rx="12" fill="#f4f1ea"/>
    <text class="t" x="28" y="38" data-i="diag.ws.t"></text>
    <text class="s" x="28" y="62" data-i="diag.ws.s1"></text>
    <text class="s" x="28" y="82" data-i="diag.ws.s2"></text>

    <line class="arrow" x1="320" y1="104" x2="320" y2="128" marker-end="url(#ah)"/>

    <rect class="box" x="10" y="130" width="620" height="102" rx="12" fill="#e9eefb" stroke="#2f4b9c"/>
    <text class="t" x="28" y="158" data-i="diag.core.t"></text>
    <text class="s" x="28" y="182" data-i="diag.core.s1"></text>
    <text class="s" x="28" y="202" data-i="diag.core.s2"></text>
    <text class="s" x="28" y="222" data-i="diag.core.s3"></text>

    <line class="arrow" x1="320" y1="234" x2="320" y2="258" marker-end="url(#ah)"/>

    <rect class="box" x="10" y="260" width="620" height="90" rx="12" fill="#f4f1ea"/>
    <text class="t" x="28" y="288" data-i="diag.tools.t"></text>
    <text class="s" x="28" y="312" data-i="diag.tools.s1"></text>
    <text class="s" x="28" y="332" data-i="diag.tools.s2"></text>
    <rect x="440" y="276" width="14" height="14" rx="4" fill="#E8A33D"/><rect x="460" y="276" width="14" height="14" rx="4" fill="#E0589F"/><rect x="480" y="276" width="14" height="14" rx="4" fill="#3FB27F"/><rect x="500" y="276" width="14" height="14" rx="4" fill="#4A8CF2"/><rect x="520" y="276" width="14" height="14" rx="4" fill="#8B6BEA"/><rect x="540" y="276" width="14" height="14" rx="4" fill="#F26D5B"/>
  </svg>

  <p class="lead" data-i="steps.lead"></p>
  <ol class="steps">
    <li style="--c:#E8A33D" data-i="step.1"></li>
    <li style="--c:#3FB27F" data-i="step.2"></li>
    <li style="--c:#4A8CF2" data-i="step.3"></li>
    <li style="--c:#8B6BEA" data-i="step.4"></li>
    <li style="--c:#F26D5B" data-i="step.5"></li>
  </ol>
  <p data-i="how.end"></p>
</section>

<section id="status" class="blk">
  <h2 class="sec" data-i="status.h"></h2>
  <p data-i="status.p"></p>
</section>

<section id="record" class="blk">
  <h2 class="sec" data-i="record.h"></h2>
  <div class="cards">
    <article class="pcard" style="--c:#E8A33D"><h3 data-i="rec1.h"></h3><p data-i="rec1.p"></p></article>
    <article class="pcard" style="--c:#3FB27F"><h3 data-i="rec2.h"></h3><p data-i="rec2.p"></p></article>
    <article class="pcard" style="--c:#4A8CF2"><h3 data-i="rec3.h"></h3><p data-i="rec3.p"></p></article>
    <article class="pcard" style="--c:#8B6BEA"><h3 data-i="rec4.h"></h3><p data-i="rec4.p"></p></article>
  </div>
</section>

<section id="build" class="blk">
  <h2 class="sec" data-i="build.h"></h2>
  <p data-i="build.p"></p>
  <ul class="plain">
    <li data-i="build.l1"></li>
    <li data-i="build.l2"></li>
    <li data-i="build.l3"></li>
  </ul>
</section>

<section id="timeline" class="blk">
  <h2 class="sec" data-i="tl.h"></h2>
  <ul class="timeline">
    <li style="--c:#E8A33D" data-i="tl.1"></li>
    <li style="--c:#3FB27F" data-i="tl.2"></li>
    <li style="--c:#4A8CF2" data-i="tl.3"></li>
    <li style="--c:#8B6BEA" data-i="tl.4"></li>
    <li style="--c:#F26D5B" data-i="tl.5"></li>
    <li style="--c:#2f4b9c" data-i="tl.6"></li>
  </ul>
</section>

<section id="founder" class="blk">
  <h2 class="sec" data-i="founder.h"></h2>
  <p data-i="founder.p"></p>
  <p><a href="https://www.linkedin.com/in/charlesdb/" rel="noopener" data-i="founder.link"></a></p>
</section>

</div>
</main>

<footer>
  <div class="wrap">
    <p data-i="foot.legal"></p>
    <p data-i="foot.built"></p>
  </div>
</footer>

<script>(function(){var hd=document.querySelector('header.top');function f(){var st=document.getElementById('story');var past=st&&st.getBoundingClientRect().bottom<innerHeight*0.5;hd.classList.toggle('solid',past||document.documentElement.classList.contains('reduced')||document.documentElement.classList.contains('nogl'));}addEventListener('scroll',f,{passive:true});addEventListener('load',f);f();})();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  window.__target = 0;
  (function(){
    if (document.documentElement.classList.contains('reduced')) return;
    var story = document.getElementById('story');
    function fallback(){
      var r = story.getBoundingClientRect(), h = story.offsetHeight - innerHeight;
      window.__target = Math.min(1, Math.max(0, -r.top / h));
    }
    if (window.gsap && window.ScrollTrigger) {
      gsap.registerPlugin(ScrollTrigger);
      ScrollTrigger.create({ trigger: story, start: 'top top', end: 'bottom bottom', onUpdate: function(s){ window.__target = s.progress; } });
    } else { addEventListener('scroll', fallback, {passive:true}); fallback(); }
  })();
</script>
<script type="module">
  import './assets/i18n.js';
  if (!document.documentElement.classList.contains('reduced')) {
    import('./assets/scene.js').catch(function(e){ console.error(e); document.documentElement.classList.add('nogl'); });
  }
</script>
</body>
</html>
